<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook Pro V6</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    :root {
      --bg-color: #1a1a2e;
      --panel-color: #16213e;
      --accent-color: #C9A227;
      --text-color: #F5F0E8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* --- HEADER --- */
    header {
      padding: 0 20px;
      background: var(--panel-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 50; /* Z-Index alto para estar sobre el libro */
      height: 60px;
      flex-shrink: 0;
    }

    h1 { font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
    h1 span { color: var(--accent-color); }

    .upload-btn {
      background: var(--accent-color);
      color: #000;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      border: none;
      transition: transform 0.1s;
    }
    .upload-btn:active { transform: scale(0.95); }
    #fileInput { display: none; }

    /* --- DRAG & DROP OVERLAY --- */
    #drop-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(26, 26, 46, 0.95);
      z-index: 2000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 4px dashed var(--accent-color);
    }
    #drop-overlay.active { display: flex; }
    #drop-overlay h2 { font-size: 2.5rem; color: var(--accent-color); margin-bottom: 10px; }
    #drop-overlay p { font-size: 1.2rem; opacity: 0.7; }

    /* --- ÁREA PRINCIPAL --- */
    #main-area {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle at center, #232d4b 0%, #1a1a2e 80%);
      cursor: grab;
    }
    #main-area:active { cursor: grabbing; }

    /* Contenedor del libro */
    #book-stage {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.1s linear;
      transform-origin: center center;
      z-index: 10; /* El libro está en nivel 10 */
    }

    .stf__wrapper { margin: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    .page { background-color: white; overflow: hidden; }
    /* pointer-events: none en la imagen para evitar conflictos de arrastre nativos */
    .page img { width: 100%; height: 100%; object-fit: fill; display: block; pointer-events: none; }

    /* --- NAV ARROWS (CORREGIDO) --- */
    .nav-arrow {
      position: absolute; 
      top: 50%; 
      transform: translateY(-50%);
      background: rgba(255,255,255,0.15); 
      border: 1px solid rgba(255,255,255,0.3);
      color: white; 
      width: 50px; 
      height: 50px; 
      border-radius: 50%;
      display: flex; 
      align-items: center; 
      justify-content: center;
      cursor: pointer; 
      font-size: 1.5rem; 
      
      /* Z-INDEX CRÍTICO: Debe ser superior al book-stage (10) */
      z-index: 100; 
      
      transition: all 0.2s;
    }
    .nav-arrow:hover { background: var(--accent-color); color: black; transform: translateY(-50%) scale(1.1); box-shadow: 0 0 15px rgba(201, 162, 39, 0.4); }
    .nav-arrow.prev { left: 20px; }
    .nav-arrow.next { right: 20px; }

    /* --- BARRA INFERIOR --- */
    .bottom-bar {
      height: 60px; background: var(--panel-color); border-top: 1px solid rgba(255,255,255,0.1);
      display: flex; justify-content: center; align-items: center; gap: 15px;
      z-index: 50; padding: 0 20px; flex-shrink: 0;
    }
    .control-group { display: flex; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 4px; gap: 5px; }
    .icon-btn {
      background: transparent; border: none; color: var(--text-color);
      padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; gap: 6px;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.1); }
    .icon-btn.active { background: var(--accent-color); color: black; }
    .page-info { font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.6); }

    /* --- MINIATURAS --- */
    .thumbnails-drawer {
      position: absolute; bottom: 60px; left: 0; width: 100%; height: 0;
      background: rgba(22, 33, 62, 0.95); transition: height 0.3s ease;
      overflow: hidden; display: flex; justify-content: center; z-index: 40;
      backdrop-filter: blur(10px);
    }
    .thumbnails-drawer.open { height: 140px; border-top: 1px solid var(--accent-color); }
    .thumbnails-scroll { display: flex; gap: 10px; padding: 20px; overflow-x: auto; max-width: 100%; }
    .thumb {
      height: 100px; min-width: 70px; border-radius: 4px; cursor: pointer;
      border: 2px solid transparent; opacity: 0.6; transition: 0.2s;
    }
    .thumb:hover { opacity: 1; transform: translateY(-5px); }
    .thumb.active { border-color: var(--accent-color); opacity: 1; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }

    #loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 3000; display: none;
      flex-direction: column; justify-content: center; align-items: center;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #fff;
      border-top-color: var(--accent-color); border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    #initial-msg { position: absolute; text-align: center; color: rgba(255,255,255,0.3); pointer-events: none; z-index: 5; }

    /* --- FULLSCREEN --- */
    body.is-fullscreen header { display: none; }
    body.is-fullscreen .bottom-bar { 
      position: fixed; bottom: 0; left: 0; width: 100%; 
      background: rgba(22, 33, 62, 0.85); backdrop-filter: blur(5px);
    }
    body.is-fullscreen #main-area { height: 100vh; }
  </style>
</head>
<body>

  <div id="drop-overlay">
    <h2>Suelta tu PDF aquí</h2>
    <p>para abrirlo instantáneamente</p>
  </div>

  <div id="loader"><div class="spinner"></div><div id="loader-text">Procesando...</div></div>

  <header>
    <h1>📖 Flipbook<span>Pro</span></h1>
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Subir PDF</button>
    <input type="file" id="fileInput" accept="application/pdf">
  </header>

  <div id="main-area">
    <div id="initial-msg"><h2>Arrastra o Sube un PDF</h2><p>Doble clic para Zoom · Rueda para acercar</p></div>
    
    <div id="book-stage"></div>

    <button class="nav-arrow prev" id="prevBtn" style="display:none">❮</button>
    <button class="nav-arrow next" id="nextBtn" style="display:none">❯</button>
  </div>

  <div class="thumbnails-drawer" id="thumbsDrawer">
    <div class="thumbnails-scroll" id="thumbsContainer"></div>
  </div>

  <div class="bottom-bar">
    <div class="control-group">
      <button class="icon-btn" id="btnThumb">📅</button>
    </div>
    <span class="page-info"><span id="currPage">0</span> / <span id="totalPage">0</span></span>
    <div class="control-group">
      <button class="icon-btn" id="btnSingle">📄 1</button>
      <button class="icon-btn active" id="btnDouble">📖 2</button>
    </div>
    <div class="control-group">
      <button class="icon-btn" id="btnZoomIn">🔍+</button>
      <button class="icon-btn" id="btnZoomReset">1:1</button>
    </div>
    <div class="control-group">
      <button class="icon-btn" id="btnFull">⛶</button>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const state = {
      pdf: null,
      images: [], 
      flipbook: null,
      currentPage: 0,
      isSinglePage: false,
      zoom: 1,
      pan: { x: 0, y: 0 },
      isDragging: false,
      dragStart: { x: 0, y: 0 },
      pdfPageWidth: 0,
      pdfPageHeight: 0,
      pdfAspectRatio: 0
    };

    const els = {
      fileInput: document.getElementById('fileInput'),
      loader: document.getElementById('loader'),
      loaderText: document.getElementById('loader-text'),
      bookStage: document.getElementById('book-stage'),
      mainArea: document.getElementById('main-area'),
      thumbsContainer: document.getElementById('thumbsContainer'),
      thumbsDrawer: document.getElementById('thumbsDrawer'),
      initialMsg: document.getElementById('initial-msg'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      currPage: document.getElementById('currPage'),
      totalPage: document.getElementById('totalPage'),
      dropOverlay: document.getElementById('drop-overlay')
    };

    // --- DRAG AND DROP ---
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      els.dropOverlay.classList.add('active');
    });

    els.dropOverlay.addEventListener('dragleave', (e) => {
      e.preventDefault();
      els.dropOverlay.classList.remove('active');
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      els.dropOverlay.classList.remove('active');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        const file = e.dataTransfer.files[0];
        if (file.type === 'application/pdf') processFile(file);
        else alert("Por favor, suelta un archivo PDF.");
      }
    });

    // --- EVENT LISTENERS UI ---
    els.fileInput.addEventListener('change', (e) => {
      if(e.target.files[0]) processFile(e.target.files[0]);
    });

    document.getElementById('btnThumb').onclick = () => els.thumbsDrawer.classList.toggle('open');
    document.getElementById('btnSingle').onclick = () => setViewMode(true);
    document.getElementById('btnDouble').onclick = () => setViewMode(false);
    document.getElementById('btnFull').onclick = toggleFullscreen;
    document.getElementById('btnZoomIn').onclick = () => setZoom(state.zoom + 0.4);
    document.getElementById('btnZoomReset').onclick = () => resetZoom();

    // --- CORRECCIÓN: FLECHAS EN PANTALLA ---
    // Usamos mousedown y stopPropagation para que el clic no pase al "main-area" (que inicia el drag)
    function handleArrowClick(e, direction) {
      e.stopPropagation(); // IMPORTANTE: Detiene el burbujeo
      e.preventDefault();
      if (!state.flipbook) return;
      
      if (direction === 'prev') state.flipbook.flipPrev();
      else state.flipbook.flipNext();
    }

    els.prevBtn.addEventListener('mousedown', (e) => handleArrowClick(e, 'prev'));
    els.nextBtn.addEventListener('mousedown', (e) => handleArrowClick(e, 'next'));
    // Soporte para touch también
    els.prevBtn.addEventListener('touchstart', (e) => handleArrowClick(e, 'prev'));
    els.nextBtn.addEventListener('touchstart', (e) => handleArrowClick(e, 'next'));


    // --- CORRECCIÓN: TECLADO ---
    document.addEventListener('keydown', (e) => {
      if (!state.flipbook) return;
      
      // Comprobamos key y code para máxima compatibilidad
      const isLeft = e.key === 'ArrowLeft' || e.code === 'ArrowLeft';
      const isRight = e.key === 'ArrowRight' || e.code === 'ArrowRight';
      
      if (isLeft) {
        e.preventDefault(); // Evita scroll horizontal si lo hubiera
        state.flipbook.flipPrev();
      }
      if (isRight) {
        e.preventDefault();
        state.flipbook.flipNext();
      }
      
      if (e.key === 'Escape') {
        if (document.fullscreenElement) document.exitFullscreen();
        resetZoom();
      }
    });

    // Resize inteligente
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        if (state.images.length > 0) initFlipbook();
      }, 200);
    });

    // --- ZOOM & PAN ---
    els.mainArea.addEventListener('dblclick', (e) => {
      if (state.zoom === 1) setZoom(2.5);
      else resetZoom();
    });

    els.mainArea.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.25 : 0.25;
      setZoom(state.zoom + delta);
    }, { passive: false });

    els.mainArea.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', doDrag);
    window.addEventListener('mouseup', endDrag);

    // --- PROCESADO PDF ---
    async function processFile(file) {
      els.loader.style.display = 'flex';
      els.initialMsg.style.display = 'none';
      
      try {
        const buffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(buffer).promise;
        
        const firstPage = await pdf.getPage(1);
        const viewport = firstPage.getViewport({ scale: 1 });
        state.pdfPageWidth = viewport.width;
        state.pdfPageHeight = viewport.height;
        state.pdfAspectRatio = viewport.width / viewport.height;

        state.images = [];
        els.thumbsContainer.innerHTML = '';
        
        for (let i = 1; i <= pdf.numPages; i++) {
          els.loaderText.textContent = `Página ${i} de ${pdf.numPages}...`;
          const page = await pdf.getPage(i);
          const v = page.getViewport({ scale: 2 });
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = v.width;
          canvas.height = v.height;
          await page.render({ canvasContext: ctx, viewport: v }).promise;
          const imgUrl = canvas.toDataURL('image/jpeg', 0.8);
          state.images.push(imgUrl);

          const thumb = document.createElement('div');
          thumb.className = 'thumb';
          thumb.innerHTML = `<img src="${imgUrl}">`;
          thumb.onclick = () => state.flipbook.flip(i - 1);
          els.thumbsContainer.appendChild(thumb);
        }

        els.totalPage.textContent = state.images.length;
        els.prevBtn.style.display = 'flex';
        els.nextBtn.style.display = 'flex';
        
        initFlipbook(); 

      } catch (err) {
        console.error(err);
        alert('Error: No se pudo abrir el PDF.');
      } finally {
        els.loader.style.display = 'none';
      }
    }

    function initFlipbook() {
      if (state.flipbook) { state.flipbook.destroy(); state.flipbook = null; }
      els.bookStage.innerHTML = '';
      resetZoom();

      const bookElem = document.createElement('div');
      els.bookStage.appendChild(bookElem);

      state.images.forEach(src => {
        const d = document.createElement('div');
        d.className = 'page';
        d.innerHTML = `<img src="${src}" draggable="false">`;
        bookElem.appendChild(d);
      });

      const availW = els.mainArea.clientWidth - 20;
      const availH = els.mainArea.clientHeight - 20;

      const isMobile = window.innerWidth < 768;
      const actualSingleMode = isMobile ? true : state.isSinglePage;
      
      document.getElementById('btnSingle').classList.toggle('active', actualSingleMode);
      document.getElementById('btnDouble').classList.toggle('active', !actualSingleMode);

      const bookAspectRatio = actualSingleMode ? state.pdfAspectRatio : (state.pdfAspectRatio * 2);

      let targetWidth, targetHeight;
      if (availW / availH > bookAspectRatio) {
        targetHeight = availH;
        targetWidth = targetHeight * bookAspectRatio;
      } else {
        targetWidth = availW;
        targetHeight = targetWidth / bookAspectRatio;
      }

      state.flipbook = new St.PageFlip(bookElem, {
        width: targetWidth / (actualSingleMode ? 1 : 2),
        height: targetHeight,
        size: 'fixed',
        minWidth: 100, maxWidth: 5000,
        minHeight: 100, maxHeight: 5000,
        showCover: true,
        usePortrait: actualSingleMode,
        maxShadowOpacity: 0.5,
        mobileScrollSupport: false,
        disableFlipByClick: true // Clic simple desactivado, arrastre activo
      });

      state.flipbook.loadFromHTML(document.querySelectorAll('.page'));
      
      if (state.currentPage > 0) {
         setTimeout(() => { try { state.flipbook.flip(state.currentPage); } catch(e){} }, 50);
      }

      state.flipbook.on('flip', (e) => {
        state.currentPage = e.data;
        els.currPage.textContent = e.data + 1;
        updateThumbs();
      });
    }

    function setViewMode(s) { if(state.isSinglePage !== s) { state.isSinglePage = s; initFlipbook(); } }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.body.requestFullscreen().catch(console.error);
        document.body.classList.add('is-fullscreen');
      } else {
        document.exitFullscreen();
        document.body.classList.remove('is-fullscreen');
      }
    }

    function updateThumbs() {
      document.querySelectorAll('.thumb').forEach((t, i) => {
        t.classList.toggle('active', i === state.currentPage);
        if (i === state.currentPage) t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      });
    }

    function setZoom(val) {
      state.zoom = Math.min(Math.max(1, val), 5);
      if (state.zoom === 1) state.pan = {x:0, y:0};
      updateTransform();
    }
    function resetZoom() { state.zoom = 1; state.pan = {x:0, y:0}; updateTransform(); }
    
    function updateTransform() {
      els.bookStage.style.transform = `scale(${state.zoom}) translate(${state.pan.x}px, ${state.pan.y}px)`;
      els.bookStage.classList.toggle('grab', state.zoom > 1);
    }

    function startDrag(e) {
      if (state.zoom <= 1) return;
      state.isDragging = true;
      state.dragStart = { x: e.clientX, y: e.clientY };
      els.bookStage.classList.add('grabbing');
    }
    function doDrag(e) {
      if (!state.isDragging) return;
      e.preventDefault();
      const dx = (e.clientX - state.dragStart.x) / state.zoom;
      const dy = (e.clientY - state.dragStart.y) / state.zoom;
      state.pan.x += dx; state.pan.y += dy;
      state.dragStart = { x: e.clientX, y: e.clientY };
      updateTransform();
    }
    function endDrag() { state.isDragging = false; els.bookStage.classList.remove('grabbing'); }
  </script>
</body>
</html>
